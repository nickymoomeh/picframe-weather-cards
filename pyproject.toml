[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "picframe-weather-cards"
version = "0.1.0"
description = "Resilient, headless weather cards for digital photo frames"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<14"]
license = "MIT"
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
weather-card = "weather_cards.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
